<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VaultTools</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { padding: 1.5rem; text-align: center; background: var(--card); border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; color: var(--accent); }
    .container { max-width: 600px; margin: 1rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    input, textarea, button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 1rem; }
    button { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 1rem; }
    button:active { opacity: 0.8; }
    .recipe-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .recipe-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .recipe-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; }
    .recipe-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    ul { margin-left: 1.2rem; margin-bottom: 0.5rem; }
    .status { font-size: 0.85rem; color: var(--accent); margin-top: 0.5rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>VaultTools</h1>
  </header>

  <div class="container">
    <!-- Recipe Extractor Card -->
    <div class="card">
      <h2>Extract New Recipe</h2>
      <input type="url" id="recipeUrl" placeholder="Paste recipe website URL here..." />
      <button onclick="extractAndSaveRecipe()">Extract & Save Recipe</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Saved Recipes List -->
    <h2>Saved Recipes</h2>
    <div id="recipeContainer" class="recipe-list">
      <p style="color: var(--text-muted); text-align: center;">Loading recipes...</p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THESE TWO STRINGS WITH YOUR SUPABASE CREDENTIALS:
    // Project Settings -> API -> Project URL & anon key
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://mqpvixygvhrkxrkwncdq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QyZJwvSXj7X1pN5agAOBWA_GcdBNnTm";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial load & real-time setup
    document.addEventListener("DOMContentLoaded", () => {
      loadRecipes();
      
      // Subscribe to real-time changes
      supabaseClient
        .channel('public:Recipes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'Recipes' }, () => {
          loadRecipes();
        })
        .subscribe();
    });

    async function loadRecipes() {
      const container = document.getElementById("recipeContainer");
      const { data: recipes, error } = await supabaseClient
        .from('Recipes')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color: #ef4444;">Error loading recipes: ${error.message}</p>`;
        return;
      }

      if (!recipes || recipes.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No recipes saved yet.</p>`;
        return;
      }

      container.innerHTML = recipes.map(r => `
        <div class="recipe-item">
          <div class="recipe-title">${escapeHtml(r.title || 'Untitled Recipe')}</div>
          ${r.url ? `<div class="recipe-meta"><a href="${r.url}" target="_blank" style="color: var(--accent);">Original Link</a></div>` : ''}
          ${renderIngredients(r.ingredients)}
          ${r.instructions ? `<div style="white-space: pre-line; margin-top: 0.5rem; font-size: 0.95rem;">${escapeHtml(r.instructions)}</div>` : ''}
        </div>
      `).join('');
    }

    async function extractAndSaveRecipe() {
      const urlInput = document.getElementById("recipeUrl");
      const status = document.getElementById("status");
      const url = urlInput.value.trim();

      if (!url) {
        status.textContent = "Please enter a URL.";
        return;
      }

      status.textContent = "Fetching and extracting recipe...";

      try {
        // Fetch HTML via CORS proxy
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        let extractedTitle = "";
        let extractedIngredients = [];
        let extractedInstructions = "";

        if (data.contents) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.contents, 'text/html');
          
          // Look for JSON-LD structured data (Schema.org Recipe)
          const jsonLdScripts = doc.querySelectorAll('script[type="application/ld+json"]');
          
          jsonLdScripts.forEach(script => {
            try {
              const json = JSON.parse(script.textContent);
              const recipeObj = findRecipeObject(json);
              if (recipeObj) {
                extractedTitle = recipeObj.name || "";
                extractedIngredients = recipeObj.recipeIngredient || [];
                if (Array.isArray(recipeObj.recipeInstructions)) {
                  extractedInstructions = recipeObj.recipeInstructions
                    .map(step => typeof step === 'string' ? step : step.text || "")
                    .join("\n\n");
                } else if (typeof recipeObj.recipeInstructions === 'string') {
                  extractedInstructions = recipeObj.recipeInstructions;
                }
              }
            } catch (e) {
              console.warn("Failed parsing script tag", e);
            }
          });

          // Fallback if no Schema.org JSON-LD found
          if (!extractedTitle) {
            extractedTitle = doc.querySelector('title')?.textContent || "Extracted Recipe";
          }
        }

        // Insert into Supabase
        const { error } = await supabaseClient
          .from('Recipes')
          .insert([{
            title: extractedTitle,
            ingredients: extractedIngredients,
            instructions: extractedInstructions,
            url: url
          }]);

        if (error) throw error;

        status.textContent = "Recipe saved successfully!";
        urlInput.value = "";
        loadRecipes();

      } catch (err) {
        console.error(err);
        status.textContent = "Failed to extract directly. Saving link standard format.";
        
        // Save basic fallback entry
        await supabaseClient.from('Recipes').insert([{
          title: "Saved Recipe Link",
          ingredients: [],
          instructions: "Extracted raw content directly from URL.",
          url: url
        }]);
        loadRecipes();
      }
    }

    function findRecipeObject(obj) {
      if (!obj) return null;
      if (obj['@type'] === 'Recipe' || (Array.isArray(obj['@type']) && obj['@type'].includes('Recipe'))) return obj;
      if (Array.isArray(obj)) {
        for (let item of obj) {
          const found = findRecipeObject(item);
          if (found) return found;
        }
      } else if (typeof obj === 'object') {
        if (obj['@graph']) return findRecipeObject(obj['@graph']);
        for (let key in obj) {
          if (typeof obj[key] === 'object') {
            const found = findRecipeObject(obj[key]);
            if (found) return found;
          }
        }
      }
      return null;
    }

    function renderIngredients(ing) {
      if (!ing) return '';
      let list = [];
      if (Array.isArray(ing)) list = ing;
      else if (typeof ing === 'string') list = ing.split('\n');
      
      if (list.length === 0) return '';
      return `<ul>${list.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
