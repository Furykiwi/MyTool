<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VaultTools</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --input-bg: #0f172a;
      --danger: #f43f5e;
      --radius: 12px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --input-bg: #f1f5f9;
      --danger: #e11d48;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
    
    /* Header */
    header { padding: 1rem 1.25rem; text-align: center; background: var(--card); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .header-actions { display: flex; gap: 0.5rem; }
    .icon-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.25rem; }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .container { max-width: 600px; margin: 1.25rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
    h2, h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text); }
    
    input, textarea, button { width: 100%; padding: 0.75rem 1rem; margin-top: 0.5rem; border-radius: 8px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text); font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    
    button.primary-btn { background: var(--accent); color: #ffffff; font-weight: 600; border: none; cursor: pointer; margin-top: 1rem; transition: transform 0.1s, background-color 0.2s; }
    button.primary-btn:active { transform: scale(0.98); }
    
    /* Tabs */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; margin: 0; padding: 0; width: auto; cursor: pointer; }
    .nav-item.active { color: var(--accent); }

    /* PIN Overlay */
    #pinOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
    .pin-box { background: var(--card); border: 1px solid var(--card-border); padding: 2rem; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); width: 100%; max-width: 320px; }
    .pin-input { font-size: 2rem; letter-spacing: 0.75rem; text-align: center; width: 100%; margin-top: 1rem; }

    /* Lists & Items */
    .list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .item-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 1.25rem; position: relative; box-shadow: var(--shadow); }
    .item-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 0.5rem; padding-right: 3rem; }
    .delete-btn { position: absolute; top: 1rem; right: 1rem; background: transparent; color: var(--danger); border: none; font-size: 0.8rem; width: auto; margin: 0; padding: 0.2rem 0.5rem; cursor: pointer; opacity: 0.8; }
    .delete-btn:hover { opacity: 1; }
    
    .status { font-size: 0.85rem; color: var(--accent); margin-top: 0.75rem; text-align: center; font-weight: 500; }
  </style>
</head>
<body>

  <!-- PIN Protection Overlay -->
  <div id="pinOverlay">
    <div class="pin-box">
      <h1>VaultTools</h1>
      <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">Enter 4-Digit Passcode</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" pattern="\d*" inputmode="numeric" autofocus autocomplete="off">
      <p id="pinError" style="color: var(--danger); margin-top: 0.75rem; font-size: 0.85rem; height: 1rem;"></p>
    </div>
  </div>

  <header>
    <h1>VaultTools</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙 Dark</button>
      <button class="icon-btn" onclick="lockApp()">🔒 Lock</button>
    </div>
  </header>

  <div class="container">
    
    <!-- RECIPES TAB -->
    <div id="tab-recipes" class="tab-content active">
      <div class="card">
        <h3>Save / Scrape Recipe</h3>
        <input type="url" id="recipeUrl" placeholder="Paste recipe URL..." />
        <input type="text" id="manualTitle" placeholder="Custom Title (optional)" />
        <button class="primary-btn" onclick="saveRecipe()">Extract & Save</button>
        <div id="recipeStatus" class="status"></div>
      </div>

      <h3>Saved Recipes</h3>
      <div id="recipeContainer" class="list">
        <p style="color: var(--text-muted); text-align: center;">Loading recipes...</p>
      </div>
    </div>

    <!-- NOTES TAB -->
    <div id="tab-notes" class="tab-content">
      <div class="card">
        <h3>Quick Note</h3>
        <input type="text" id="noteTitle" placeholder="Note Title..." />
        <textarea id="noteBody" rows="3" placeholder="Write something..." style="margin-top: 0.5rem;"></textarea>
        <button class="primary-btn" onclick="saveNote()">Save Note</button>
      </div>

      <h3>Saved Notes</h3>
      <div id="notesContainer" class="list">
        <p style="color: var(--text-muted); text-align: center;">Loading notes...</p>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h3>Passcode Settings</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Update the lock code stored on this device.</p>
        <input type="password" id="newPin" placeholder="New 4-digit PIN" maxlength="4" style="margin-top: 0.75rem;" />
        <button class="primary-btn" onclick="updatePin()">Update PIN</button>
        <div id="pinStatus" class="status"></div>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('recipes', this)">
      <span style="font-size: 1.2rem;">📖</span>
      <span>Recipes</span>
    </button>
    <button class="nav-item" onclick="switchTab('notes', this)">
      <span style="font-size: 1.2rem;">📝</span>
      <span>Notes</span>
    </button>
    <button class="nav-item" onclick="switchTab('settings', this)">
      <span style="font-size: 1.2rem;">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    // -------------------------------------------------------------
    // REPLACE WITH YOUR SUPABASE KEYS
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://mqpvixygvhrkxrkwncdq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QyZJwvSXj7X1pN5agAOBWA_GcdBNnTm";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('vault_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtnText(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('vault_theme', newTheme);
      updateThemeBtnText(newTheme);
    }

    function updateThemeBtnText(theme) {
      document.getElementById('themeToggleBtn').innerHTML = theme === 'dark' ? '🌙 Dark' : '☀️ Light';
    }

    // Auth PIN Logic & Auto-Validation
    function getStoredPin() { return localStorage.getItem('vault_pin') || '1234'; }

    const pinInput = document.getElementById('pinInput');
    pinInput.addEventListener('input', () => {
      const pinError = document.getElementById('pinError');
      pinError.textContent = '';
      
      if (pinInput.value.length === 4) {
        if (pinInput.value === getStoredPin()) {
          document.getElementById('pinOverlay').style.display = 'none';
          pinInput.value = '';
        } else {
          pinError.textContent = 'Incorrect PIN';
          pinInput.value = '';
        }
      }
    });

    function lockApp() {
      document.getElementById('pinOverlay').style.display = 'flex';
      setTimeout(() => pinInput.focus(), 50);
    }

    function updatePin() {
      const pin = document.getElementById('newPin').value;
      if (pin.length === 4 && /^\d+$/.test(pin)) {
        localStorage.setItem('vault_pin', pin);
        document.getElementById('pinStatus').textContent = 'PIN updated for this device!';
        document.getElementById('newPin').value = '';
      } else {
        document.getElementById('pinStatus').textContent = 'Please enter a valid 4-digit PIN.';
      }
    }

    // Navigation
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      btn.classList.add('active');
    }

    // Init Application
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      loadRecipes();
      loadNotes();
      setTimeout(() => pinInput.focus(), 100);

      supabaseClient.channel('public:Recipes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'Recipes' }, () => loadRecipes())
        .subscribe();
    });

    // Recipe Handling
    async function loadRecipes() {
      const container = document.getElementById("recipeContainer");
      const { data: recipes, error } = await supabaseClient
        .from('Recipes')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color: var(--danger);">Error: ${error.message}</p>`;
        return;
      }
      if (!recipes || recipes.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No recipes saved yet.</p>`;
        return;
      }

      container.innerHTML = recipes.map(r => `
        <div class="item-card">
          <button class="delete-btn" onclick="deleteRecipe(${r.id})">Delete</button>
          <div class="item-title">${escapeHtml(r.title || 'Untitled')}</div>
          ${r.url ? `<div style="margin-bottom:0.5rem;"><a href="${r.url}" target="_blank" style="color:var(--accent); font-size:0.85rem;">Original Website</a></div>` : ''}
          ${renderList(r.ingredients)}
          ${r.instructions ? `<div style="white-space: pre-line; font-size: 0.9rem; margin-top:0.5rem; color: var(--text-muted);">${escapeHtml(r.instructions)}</div>` : ''}
        </div>
      `).join('');
    }

    async function saveRecipe() {
      const urlInput = document.getElementById("recipeUrl");
      const titleInput = document.getElementById("manualTitle");
      const status = document.getElementById("recipeStatus");
      const url = urlInput.value.trim();
      const customTitle = titleInput.value.trim();

      if (!url && !customTitle) {
        status.textContent = "Please provide a URL or Title.";
        return;
      }

      status.textContent = "Processing...";

      let extractedTitle = customTitle;
      let extractedIngredients = [];
      let extractedInstructions = "";

      if (url) {
        try {
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data.contents) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
            
            scripts.forEach(s => {
              try {
                const json = JSON.parse(s.textContent);
                const rec = findRecipe(json);
                if (rec) {
                  if (!extractedTitle) extractedTitle = rec.name;
                  extractedIngredients = rec.recipeIngredient || [];
                  if (Array.isArray(rec.recipeInstructions)) {
                    extractedInstructions = rec.recipeInstructions.map(step => typeof step === 'string' ? step : step.text || "").join("\n\n");
                  } else if (typeof rec.recipeInstructions === 'string') {
                    extractedInstructions = rec.recipeInstructions;
                  }
                }
              } catch(e){}
            });
            if (!extractedTitle) extractedTitle = doc.querySelector('title')?.textContent || "Saved Link";
          }
        } catch(e) {
          console.warn("Proxy block, saving basic link.");
        }
      }

      const { error } = await supabaseClient.from('Recipes').insert([{
        title: extractedTitle || "Recipe Link",
        ingredients: extractedIngredients,
        instructions: extractedInstructions,
        url: url
      }]);

      if (error) status.textContent = `Error: ${error.message}`;
      else {
        status.textContent = "Saved successfully!";
        urlInput.value = "";
        titleInput.value = "";
        loadRecipes();
      }
    }

    async function deleteRecipe(id) {
      if (confirm("Delete this recipe?")) {
        await supabaseClient.from('Recipes').delete().eq('id', id);
        loadRecipes();
      }
    }

    function findRecipe(obj) {
      if (!obj) return null;
      if (obj['@type'] === 'Recipe' || (Array.isArray(obj['@type']) && obj['@type'].includes('Recipe'))) return obj;
      if (Array.isArray(obj)) {
        for (let item of obj) { const f = findRecipe(item); if (f) return f; }
      } else if (typeof obj === 'object') {
        if (obj['@graph']) return findRecipe(obj['@graph']);
        for (let k in obj) { if (typeof obj[k] === 'object') { const f = findRecipe(obj[k]); if (f) return f; } }
      }
      return null;
    }

    function renderList(arr) {
      if (!arr) return '';
      let list = Array.isArray(arr) ? arr : typeof arr === 'string' ? arr.split('\n') : [];
      if (list.length === 0) return '';
      return `<ul style="margin-left: 1.2rem; font-size: 0.9rem; margin-top: 0.25rem;">${list.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Notes Feature
    function saveNote() {
      const title = document.getElementById("noteTitle").value.trim();
      const body = document.getElementById("noteBody").value.trim();
      if (!title && !body) return;
      
      let notes = JSON.parse(localStorage.getItem("vault_notes") || "[]");
      notes.unshift({ id: Date.now(), title, body });
      localStorage.setItem("vault_notes", JSON.stringify(notes));
      
      document.getElementById("noteTitle").value = "";
      document.getElementById("noteBody").value = "";
      loadNotes();
    }

    function loadNotes() {
      const container = document.getElementById("notesContainer");
      let notes = JSON.parse(localStorage.getItem("vault_notes") || "[]");
      if (notes.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No notes saved yet.</p>`;
        return;
      }
      container.innerHTML = notes.map(n => `
        <div class="item-card">
          <button class="delete-btn" onclick="deleteNote(${n.id})">Delete</button>
          <div class="item-title">${escapeHtml(n.title || 'Untitled Note')}</div>
          <div style="white-space: pre-line; font-size: 0.9rem; color: var(--text-muted);">${escapeHtml(n.body)}</div>
        </div>
      `).join('');
    }

    function deleteNote(id) {
      let notes = JSON.parse(localStorage.getItem("vault_notes") || "[]").filter(n => n.id !== id);
      localStorage.setItem("vault_notes", JSON.stringify(notes));
      loadNotes();
    }
  </script>
</body>
</html>
